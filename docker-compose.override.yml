# Build the local custom branch from the current repository checkout.
services:
  metapi:
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/ppBruce/metapi
        org.opencontainers.image.revision: 22f9af3c86dedaf25e68b6bee4d1b7431c95b579
        org.opencontainers.image.version: 1.7.9-custom
