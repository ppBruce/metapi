# Build the local custom branch from the current repository checkout.
services:
  metapi:
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/ppBruce/metapi
        org.opencontainers.image.revision: 4630d1f2404bb0fb0a4bdda141dcc69f2151d178
        org.opencontainers.image.version: 1.7.10-custom
