<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Core cube (visual anchor, brightest) -->
    <linearGradient id="core-top" x1="21" y1="23" x2="43" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="core-left" x1="21" y1="29" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="core-right" x1="43" y1="29" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <!-- Source cubes (equilateral layout, slightly dimmed) -->
    <linearGradient id="src-top" x1="25" y1="4" x2="39" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="src-face" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="src-face-dark" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Inflow arcs: three upstream sources converge on the gateway core -->
  <g stroke="url(#flow)" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M32 12 Q34 17 32 23.5" fill="none"/>
    <path d="M11 44.5 Q14 34 21 29" fill="none"/>
    <path d="M53 44.5 Q50 34 43 29" fill="none"/>
  </g>
  <circle cx="32" cy="12" r="1.3" fill="#5eead4"/>
  <circle cx="11" cy="44.5" r="1.3" fill="#5eead4"/>
  <circle cx="53" cy="44.5" r="1.3" fill="#5eead4"/>

  <!-- Source cubes -->
  <g opacity="0.92">
    <path d="M32 4.5 L39 8 L32 11.5 L25 8 Z" fill="url(#src-top)"/>
    <path d="M25 8 L32 11.5 L32 18.5 L25 15 Z" fill="url(#src-face)"/>
    <path d="M39 8 L32 11.5 L32 18.5 L39 15 Z" fill="url(#src-face-dark)"/>
    <path d="M11 44.5 L18 48 L11 51.5 L4 48 Z" fill="url(#src-top)"/>
    <path d="M4 48 L11 51.5 L11 58.5 L4 55 Z" fill="url(#src-face)"/>
    <path d="M18 48 L11 51.5 L11 58.5 L18 55 Z" fill="url(#src-face-dark)"/>
    <path d="M53 44.5 L60 48 L53 51.5 L46 48 Z" fill="url(#src-top)"/>
    <path d="M46 48 L53 51.5 L53 58.5 L46 55 Z" fill="url(#src-face)"/>
    <path d="M60 48 L53 51.5 L53 58.5 L60 55 Z" fill="url(#src-face-dark)"/>
  </g>

  <!-- Gateway core cube -->
  <path d="M32 23.5 L43 29 L32 34.5 L21 29 Z" fill="url(#core-top)"/>
  <path d="M21 29 L32 34.5 L32 45.5 L21 40 Z" fill="url(#core-left)"/>
  <path d="M43 29 L32 34.5 L32 45.5 L43 40 Z" fill="url(#core-right)"/>
</svg>
