name: Nightly Release

# Nightly packaging: same build pipeline as release.yml (verify -> desktop
# packages -> docker build), but the Docker images are saved as tar.gz
# archives attached to a pre-release instead of pushed to any registry.
# Grab the tar for your arch from the release page and
# `docker load -i metapi-docker-<arch>-<tag>.tar.gz`.
#
# Runs nightly at 21:30 CST (13:30 UTC) and on manual dispatch. Dispatch
# accepts an optional `ref` to build any branch/tag instead of main.

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload built dist
        uses: actions/upload-artifact@v7
        with:
          name: metapi-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  build-packages:
    name: Build Desktop Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            artifactLabel: linux-x64
          - platform: windows
            runner: windows-latest
            artifactLabel: windows-x64
          - platform: mac-arm64
            runner: macos-15
            artifactLabel: mac-arm64
            packageCommand: npx electron-builder --config electron-builder.yml --publish never --mac --arm64
            expectedMacArch: arm64
          - platform: mac-x64
            runner: macos-15-intel
            artifactLabel: mac-x64
            packageCommand: npx electron-builder --config electron-builder.yml --publish never --mac --x64
            expectedMacArch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Restore Electron cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Restore Electron cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ${{ runner.temp }}/.cache/appimage-tools
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Restore Electron cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Electron binary
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/.cache/electron
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
        run: |
          set -euo pipefail
          # mac-x64 matrix builds Intel packages; force the matching Electron arch.
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            export npm_config_arch=x64
            export ELECTRON_INSTALL_ARCH=x64
          elif [ "${{ matrix.platform }}" = "mac-arm64" ]; then
            export npm_config_arch=arm64
            export ELECTRON_INSTALL_ARCH=arm64
          fi
          node node_modules/electron/install.js
          test -d node_modules/electron/dist

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm

      - name: Download built dist
        uses: actions/download-artifact@v8
        with:
          name: metapi-dist-${{ github.sha }}
          path: dist

      - name: Package (non-macOS)
        if: "!startsWith(matrix.platform, 'mac-')"
        run: npx electron-builder --config electron-builder.yml --publish never

      - name: Disable Spotlight indexing (keeps hdiutil detach from failing with "Resource busy")
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        run: sudo mdutil -a -i off

      - name: Package (macOS)
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          PACKAGE_COMMAND: ${{ matrix.packageCommand }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Desktop build (${PACKAGE_COMMAND}) attempt ${attempt}/2"
            if eval "${PACKAGE_COMMAND}"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 90
          done

      - name: Verify macOS architecture
        if: startsWith(matrix.platform, 'mac-')
        run: node scripts/desktop/verifyMacArchitecture.mjs --release-dir release --expected-arch "${{ matrix.expectedMacArch }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifactLabel }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.snap
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
            release/builder-debug.yml
          if-no-files-found: error

  build-docker-tar:
    name: Docker tar.gz (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v4

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # nightly-YYYYMMDD-<shortsha or ref>
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.ref }}"
          else
            ref="${{ github.ref_name }}"
          fi
          short_sha="$(git rev-parse --short HEAD)"
          safe_ref="$(printf '%s' "$ref" | tr '/_' '--' | tr -cd 'a-zA-Z0-9.-')"
          echo "tag=metapi:nightly-${safe_ref}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.platform }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=nightly-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.arch }}

      - name: Save image to tar.gz
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # Suffix the arch so the three per-arch artifacts can't collide when
          # merge-multiple flattens them into one directory at release time.
          safe_tag="$(printf '%s' "$tag" | tr '/:' '--')-${{ matrix.arch }}"
          docker save "$tag" | gzip > "${safe_tag}.tar.gz"
          ls -lh "${safe_tag}.tar.gz"

      - name: Upload docker tar artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.arch }}
          path: metapi-*nightly-*.tar.gz
          if-no-files-found: error
  publish-nightly-release:
    name: Publish Nightly Release
    needs: [build-packages, build-docker-tar]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve nightly tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # Fixed tag "nightly": recreated on each run at the built ref's HEAD,
          # so exactly one rolling nightly release/tag exists at any time.
          echo "tag=nightly" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          # Exclude the big intermediate dist artifact from the release;
          # match only desktop packages and docker tars by name prefix.
          pattern: '{desktop-*,docker-*}'
          merge-multiple: true

      - name: Show release files
        run: ls -la release-assets

      - name: Delete previous nightly release (tag "nightly")
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Rolling release: exactly one nightly release/tag exists. Delete the
          # previous one (legacy nightly-* releases included) before uploading.
          gh release list --json tagName --jq '.[].tagName' | grep -E '^nightly' || true
          for old in $(gh release list --json tagName --jq '.[].tagName' | grep -E '^nightly'); do
            gh release delete "$old" --cleanup-tag --yes
          done

      - name: Generate release body
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/generateDownloadBadges.mjs \
            --tag "${{ steps.tag.outputs.tag }}" --dir release-assets \
            --out "$RUNNER_TEMP/downloads.md"
          {
            cat "$RUNNER_TEMP/downloads.md"
            echo
            echo '---'
            echo
            echo 'Automated nightly build. Same pipeline as the tagged release; the'
            echo 'Docker images are **not pushed** to any registry — download the'
            echo 'tar.gz for your architecture and load it locally:'
            echo
            echo '```'
            echo 'docker load -i metapi-*<arch>.tar.gz'
            echo '```'
          } > "$RUNNER_TEMP/nightly-body.md"
          head -20 "$RUNNER_TEMP/nightly-body.md"

      - name: Upload Nightly Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Create the release first, then upload assets ONE AT A TIME.
          # The previous softprops/action-gh-release step uploaded everything
          # concurrently, which intermittently fails the larger files with
          # "Error creating asset temp dir" (GitHub upload-endpoint flake) and
          # leaves a half-populated release behind. Sequential uploads with
          # explicit retries plus the count check in the next step make a
          # partial publish impossible to mistake for a good one.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Nightly ($TAG)" \
              --prerelease \
              --notes-file "$RUNNER_TEMP/nightly-body.md"
          fi

          upload_with_retry() {
            local file="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "✅ uploaded $(basename "$file")"
                return 0
              fi
              echo "⚠️  upload attempt $attempt failed for $(basename "$file"); retrying in 15s"
              sleep 15
            done
            echo "::error::giving up on $(basename "$file") after 5 attempts"
            return 1
          }

          for f in release-assets/*; do
            [ -f "$f" ] || continue
            upload_with_retry "$f"
          done

      - name: Verify nightly release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          echo "expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::nightly release is incomplete: $actual/$expected assets uploaded"
            gh release view "$TAG" --json assets --jq '.assets[].name' || true
            exit 1
          fi
