# Fresh ppBruce/metapi 1.7.2 deployment; previous database remains in ./data/hub.db.
services:
  metapi:
    image: metapi:ppbruce-06bbc6e
    ports:
    - 4000:4000
    volumes:
    - ./data/ppbruce:/app/data
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      PROXY_TOKEN: ${PROXY_TOKEN:?PROXY_TOKEN is required}
      CHECKIN_CRON: 0 8 * * *
      BALANCE_REFRESH_CRON: 0 * * * *
      PORT: ${PORT:-4000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      ACCOUNT_CREDENTIAL_SECRET: ${ACCOUNT_CREDENTIAL_SECRET:?ACCOUNT_CREDENTIAL_SECRET
        is required}
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:'+process.env.PORT+'/api/health/ready',{signal:AbortSignal.timeout(3000)}).then(async
        r=>{if(!r.ok || !(await r.json()).ready)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
